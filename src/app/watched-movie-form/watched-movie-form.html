<form [formGroup]="watchedMovieForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="user">Username</label>
    <input id="user" formControlName="user" />
  </div>

  <div>
    <label for="movieID">Movie ID</label>
    <input id="movieID" formControlName="movieID" />
  </div>

  <div>
    <label for="watchedDate">Watched Date</label>
    <input id="watchedDate" formControlName="watchedDate" type="date" />
  </div>

  <button type="submit" [disabled]="watchedMovieForm.invalid">Submit</button>
</form>
