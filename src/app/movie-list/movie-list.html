<div class="header"><h1>Movies</h1></div>

@if (movies().length > 0) {
    <ul class="movie-grid">
        @for(movie of movies(); track movie.movieID) {
            <li class="movie-block" (click)="goToMovie(movie.movieID)">
                <img class="thumbnail" 
                    [src]="movie.thumbnailUrl" 
                    alt="{{ movie.title }}" />
                <app-movie-detail [movie]="movie"></app-movie-detail>
                <button type="button"
                    (click)="deleteMovie(movie.movieID); $event.stopPropagation()">Delete</button>
            </li>
        }   
    </ul>
} @else {
    <p>No movies available</p>
}
